name: Windows checks and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      SDL_AUDIODRIVER: dummy
      MUUZIKA_DATA_DIR: ${{ runner.temp }}/muuzika-ci
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-release.txt pyinstaller==6.22.3
      - run: choco install ffmpeg --yes --no-progress
      - run: python -m unittest discover -s tests -v
      - run: python tests/ui_smoke.py
      - run: python build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: Muuzika-Windows-beta
          path: |
            releases/*.zip
            releases/*.sha256
            tests/ui-smoke-result.json
          if-no-files-found: error
